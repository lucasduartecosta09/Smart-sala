<section id="voz-widget" class="voz-widget" aria-label="Comando de voz">
    <div class="voz-cabecalho">
        <div class="voz-indicador-container" aria-hidden="true">
            <span class="voz-indicador-onda voz-indicador-onda-externa"></span>
            <span class="voz-indicador-onda voz-indicador-onda-interna"></span>
            <span class="voz-equalizador"><i></i><i></i><i></i><i></i><i></i></span>
            <span class="voz-indicador"></span>
        </div>
        <div class="voz-identidade">
            <strong>Smart · Assistente de voz</strong>
            <span id="voz-status" aria-live="polite">Microfone desligado</span>
        </div>
        <button id="btn-voz" type="button" aria-pressed="false">Iniciar voz</button>
    </div>
    <label class="voz-modo-continuo" for="voz-continuo">
        <input id="voz-continuo" type="checkbox" checked>
        <span>Continuar ouvindo após o comando</span>
    </label>
    <div class="voz-transcricao">
        <span>Transcrição</span>
        <output id="voz-texto" aria-live="polite">Aguardando fala…</output>
    </div>
</section>
